[project]
name = "agente-citas-backend"
version = "0.1.0"
description = "Backend para bot de agendamiento por WhatsApp"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic[email]",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "alembic",
    "asyncpg",
    "argon2-cffi",
    "redis",
    "structlog",
    "python-jose[cryptography]",
    "httpx",
    "anthropic",
    # Time zone database. Windows has none, and slim Linux images often ship
    # without /usr/share/zoneinfo, so ZoneInfo("America/La_Paz") raises and every
    # conversion silently falls back to UTC — which offsets business hours,
    # available slots and every time quoted to the client.
    "tzdata",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
